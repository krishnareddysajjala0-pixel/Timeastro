name: Build Ravan Astro Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip

      - name: Sync Android Assets & Python Code
        run: |
          python setup_android.py

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android_app/gradlew

      - name: Build Android APK
        working-directory: android_app
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavanAstro-Android-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
