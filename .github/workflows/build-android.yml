name: Build Ravan Astro Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk-and-aab:
    name: Build Android APK and AAB Bundle
    runs-on: ubuntu-24.04
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"
      GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip

      - name: Sync Android Assets & Python Code
        run: |
          python setup_android.py

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android_app/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Build Android AAB Bundle & APK
        working-directory: android_app
        run: |
          ./gradlew bundleRelease assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RavanAstro-PlayStore-AAB
          path: android_app/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APKs (Release & Debug)
        uses: actions/upload-artifact@v4
        with:
          name: RavanAstro-Android-APK
          path: |
            android_app/app/build/outputs/apk/release/*.apk
            android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
