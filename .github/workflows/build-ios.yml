name: Build Ravan Astro iOS (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node & Python Dependencies
        run: |
          npm install -g @capacitor/cli
          npm install
          pip install flask swisseph timezonefinderL python-dateutil requests

      - name: Prepare Assets & Capacitor iOS Project
        run: |
          mkdir -p www
          cp templates/index.html www/index.html
          cp -r templates static translations *.py *.json *.txt www/ 2>/dev/null || true
          npx cap init "Ravan Astro" "com.ravanastro.app" --web-dir www || true
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          pod install || true
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPEC="" \
                     build || xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

          mkdir -p ../../build-output/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app ../../build-output/Payload/
          cd ../../build-output
          zip -r RavanAstro.ipa Payload

      - name: Upload iOS App (.ipa) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavanAstro-iOS-IPA
          path: build-output/RavanAstro.ipa
          retention-days: 14
